name: Release

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Add prerelease config
        if: ${{ github.ref_name != 'develop' }}
        env:
          BRANCH: ${{ github.ref_name }}
          CONFIG: '.github/release-please-config.json'
        run: |
          jq --arg prtype "$BRANCH" \
            '.packages["."].prerelease = true
            | .packages["."]["prerelease-type"] = $prtype' \
            $CONFIG > tmp && mv tmp $CONFIG
          cat $CONFIG

      - name: Remove prerelease config
        if: ${{ github.ref_name == 'develop' }}
        env:
          CONFIG: '.github/release-please-config.json'
        run: |
          jq 'del(.packages["."].prerelease, .packages["."]["prerelease-type"])' \
            $CONFIG > tmp && mv tmp $CONFIG || true
          cat $CONFIG

      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          token: ${{ secrets.CONTENTS_WRITE_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js & NPM
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          scope: '@bussin'
          always-auth: true

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Publish to NPM
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish GitHub Release
        run: gh release edit ${{ needs.release-please.outputs.tag_name }} --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
